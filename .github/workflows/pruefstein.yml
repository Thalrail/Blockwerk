name: Prüfstein Zitadelle

# Dauert einige Minuten: nur auf Knopfdruck (Actions → Prüfstein Zitadelle → Run workflow) und jede Woche
on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'

jobs:
  pruefstein:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run test:pruefstein
